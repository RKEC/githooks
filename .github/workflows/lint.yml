name: lint

on:
  push:
    branches: [main]
  pull_request:

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run ShellCheck
        run: |
          files=$(find . -path ./.git -prune -o -type f \( -name '*.sh' -o -path './hooks/*' \) ! -name '.gitkeep' -print)
          if [ -n "$files" ]; then shellcheck $files; else echo "No scripts yet"; fi
